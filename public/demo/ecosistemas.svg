<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="900" height="600" fill="#f7f7f5"/><text x="60" y="72" font-family="Arial" font-weight="bold" font-size="22" fill="#111">ACADEMIA.</text><text x="60" y="150" font-family="Arial" font-size="36" font-weight="bold" fill="#111">Un ecosistema conectado</text><text x="60" y="185" font-family="Arial" font-size="17" fill="#666">Los seres vivos y su entorno interactúan entre sí.</text><circle cx="450" cy="355" r="100" fill="#111"/><text x="450" y="363" font-family="Arial" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">ECOSISTEMA</text><g fill="#fff" stroke="#111" stroke-width="3"><circle cx="190" cy="335" r="70"/><circle cx="710" cy="335" r="70"/><circle cx="450" cy="520" r="70"/></g><g stroke="#111" stroke-width="3"><line x1="260" y1="335" x2="350" y2="345"/><line x1="550" y1="345" x2="640" y2="335"/><line x1="450" y1="455" x2="450" y2="450"/></g><g font-family="Arial" font-weight="bold" font-size="18" text-anchor="middle"><text x="190" y="342">Plantas</text><text x="710" y="342">Animales</text><text x="450" y="527">Entorno</text></g></svg>
